# ─────────────────────────────
# ─────────────────────────────
# Font
font_family Iosevka Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0
hide_window_decorations yes
w
# ─────────────────────────────
# Window
# ─────────────────────────────

window_padding_width 12
dynamic_background_opacity yes

# ─────────────────────────────
# Cursor
# ─────────────────────────────

cursor_shape block
cursor_blink_interval 0.5

# ─────────────────────────────
# Tabs
# ─────────────────────────────

tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"


# ─────────────────────────────
# Scrollback
# ─────────────────────────────

scrollback_lines 10000

# ─────────────────────────────
# Mouse / URLs
# ─────────────────────────────

mouse_hide_wait 3
url_style curly


# BEGIN_KITTY_FONTS
font_family      family='IosevkaTerm Nerd Font' postscript_name=IosevkaTermNF
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


foreground              #ece4cc
background              #1c212b
selection_foreground    #080a1f
selection_background    #e8c26a

cursor                  #e8c26a
cursor_text_color       #080a1f
url_color               #6fb7b5



background_opacity 0.75
background_blur 1
